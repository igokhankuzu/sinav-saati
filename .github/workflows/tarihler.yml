# Her gün ÖSYM takvimini okuyup tarihler.json'u günceller.
# GitHub'da "Actions" sekmesinden "Run workflow" ile elle de çalıştırılabilir.
name: Sınav tarihlerini güncelle

on:
  schedule:
    - cron: "0 3 * * *"   # her gün 03:00 UTC = Türkiye saatiyle 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ÖSYM takvimini oku
        run: python3 araclar/tarihleri_guncelle.py

      - name: Değiştiyse kaydet
        run: |
          if git diff --quiet -- tarihler.json; then
            echo "Değişiklik yok."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tarihler.json
            git commit -m "Sınav tarihlerini ÖSYM takviminden güncelle"
            git push
          fi
